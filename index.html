<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body>
    <main>
        <div id="Titulo" class="text-3xl">
            <h1>Lista de Tareas Básicas</h1>
            <p>Esta lista sirve para recordar que cosas tengo que hacer diariamente:</p>
        </div>
        <div id="Formulario">
            <form id="Form">
                <label for="ftask">Tarea a realizar</label><br>
                <input type="text" id="ftask" name="ftask">
                <input type="submit" value="Enviar">
            </form>
        </div>
        <div id="Listas">
            <div id="Lista">
                <p>Lista de tareas por hacer</p>
                <ol id="Tareas1">
                    
                </ol>
            </div>
            <div id="Lista-proceso">
                <p>Lista de tareas realizadas</p>
                <ol id="Tareas2">
                    
                </ol>
            </div>
            <div id="Lista-completada">
                <p>Lista de tareas completadas</p>
                <ol id="Tareas3">
                    
                </ol>
            </div>
        </div>
    </main>
    <script src="script.js"></script>
</body>
</html>
