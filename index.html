<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!--<link rel="stylesheet" href="style.css">-->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-blue-400">
    <main>
        <div id="Titulo">
            <h1 class="font-serif text-4xl text-center text-red-600 ">Lista de Tareas Básicas</h1>
            <p class="font-sans text-lg">Esta lista sirve para recordar que cosas tengo que hacer diariamente:</p>
        </div>
        <div id="Formulario" class="flex justify-center w-400px">
            <form data-js="form-1">
                <label for="ftask" class="block text-white text-center mb-3 font-sans text-xl">Tarea a realizar</label>
                <input id="ftask"ype="text" data-js="input-text-1" name="ftask" class="bg-white text-black px-2 py-1 mr-1 rounded-md shadow-md focus:outline-none">
                <input type="submit" value="Enviar" class="text-white bg-red-500 px-2 py-1 rounded-md font-medium shadow-lg hover:bg-red-400 transition-all active:scale-95 cursor-pointer">
            </form>
        </div>
        <div id="Listas" class="pt-6 flex justify-evenly">
            <div id="Lista-por-hacer" class="bg-gray-400 px-2 py-2 w-70 rounded-md shadow-md">
                <p class="text-white text-center line-clamp-2">Lista de tareas por hacer</p>
                <ol data-js="list-task-1">
                    
                </ol>
            </div>
            <div id="Lista-proceso" class="bg-blue-600 px-2 py-2 w-70 rounded-md shadow-md">
                <p class="text-black text-center line-clamp-2">Lista de tareas realizadas</p>
                <ol data-js="list-task-2">
                    
                </ol>
            </div>
            <div id="Lista-completada" class="bg-green-400 px-2 py-2 w-70 rounded-md shadow-md">
                <p class="text-blue-900 text-center line-clamp-2">Lista de tareas completadas</p>
                <ol data-js="list-task-3">
                    
                </ol>
            </div>
        </div>
    </main>
    <script type="module" src="ui.js"></script>
</body>
</html>
